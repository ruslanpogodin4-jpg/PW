[General]
# Server name, displayed in the client part of the window
servname=pw
# Password hash to connection from client side. If you leave it empty - password from the client side will be installed on first connection
password	=	07410f891ebbaa13742ddbdf7030b28a
# Port for connecting from client side
port=6565
# Path to the base game folder
homepath=/home
# gs filename (GameServer)
gs_name=gs
# Path to gs.conf, support variable $HOME$, which will be replaced by the value of the variable homepath with Auto Add / at the end
gs_conf_path=$HOME$gamed/gs.conf
# Path to the folder with gs file (support variable $HOME$, which will be replaced by the value of the variable homepath with Auto Add / at the end)
gs_path=$HOME$gamed
# Server Aid
aid=1
# Server ZoneId
zoneid=1
# Server ID from serverlist.txt to display faction icons
servid=1
# The name of the default icon to display faction icons
default_icon=0_0.dds
# Number of the last lines pwadmin logs, which will be transmitted to the client of the on-demand (recommened no more than 300)
log_row_count=150
# The path to the folder were the logs will be written when you start processes (the folder must exist, otherwise the process will not start!)
logpath=/home/logs
# Server elements.data version, this value will be determined by the desired communication protocols
# Maximum version of the supported protocols 156
ServerVersion=127
# PID file is created when you run the server part, it will be stored process id
pidfile=/var/run/pwadmin5.pid
# Fixed pause after starting instance (if autoload instance and start from client side pwadmin), seconds
PauseStartInstanceFixed=5
# Pause after each instance (if autoload instance and start from client side pwadmin), seconds
PauseStartPerInstance=2
# The maximum number of lines to read game chat
MaxChatRow=200
# The maximum number of lines to read world2.formatlog
MaxFormatLogRow=200
#  The maximum number of lines to read world2.log
MaxWorld2LogRow=400
# Type of the password hash for AuthD, 0 - Base64, 1 - Binary, 2 - 0xHex
AuthDType=0
# Shell add command for launch instances
ShellAdd=nohup %s
# Backup folder for the game database (the folder must exist, otherwise backups will not be created!)
GameBackupPath=$HOME$backup
# Backup folder for the account database (the folder must exist, otherwise backups will not be created!)
MysqlBackupPath=$HOME$backup
# Method of Mysql database backup (1 - for Debian/Ubuntu systems, 2 - for others)
MysqlBackupType=2
# In MySql section contains information for a connection to a MySQL database
#  do not confuse them with those of the client side connection data

[Mysql]
# Username
user=root
# Password (if the password contains characters that specify it in quotation marks)
pass=1234
# Hostname
host=127.0.0.1
# Port
port=3306
# Database name
base=pw
# Encoding (for SET names query), for a connection to a standard encoding, comment option (commented out by default)
#mysql_names=cp1251
# The name of the field in the users table to display GM data, usually name or truename
gmfield=name
# Name of additional fields for displaying and editing in the list of accounts (can be used for PC)
lkfield=truename
lkfield1=truename
lkfield2=truename
lkfield3=truename
# Visibility of additional fields in the list of accounts, 1 - yes, 0 - no
lkfield_visible=1
lkfield1_visible=0
lkfield2_visible=0
lkfield3_visible=0
# The names of the standard fields (at ordinary assembly, you can not change)
idfield=ID
namefield=name
emailfield=email
zoneidfield=zoneid
passfield=passwd
pass2field=passwd2
pointuidfield=uid
pointaidfield=aid
point_lastlogin=lastlogin
changepassproc=changePasswd
authtable=auth
auth_userid=userid
auth_zoneid=zoneid
auth_rid=rid
# Names of tables and fields for a ban of the table (actual only for 1.3.6 server version)
forbid_table=forbid
forbid_userid=userid
forbid_type=type
forbid_ctime=ctime
forbid_time=forbid_time
forbid_reason=reason
forbid_gmroleid=gmroleid
# Data for a connection to the GDelivery
mysql_names=

[GDelivery]
# IP address for the remote machine usually 127.0.0.1, virtual 10.0.2.15
ip=127.0.0.1
port=29100
provider_port=29300
# Data for a connection to the GameDBD

[GameDBD]
# IP address for the remote machine usually 127.0.0.1, virtual 10.0.2.15
ip=127.0.0.1
port=29400
# Data for a connection to the Uniquenamed (isec and osec keys must be turned off)

[Uniquenamed]
# IP address for the remote machine usually 127.0.0.1, virtual 10.0.2.15
ip=127.0.0.1
port=29401
# Options section contains permissions and prohibitions on actions from the client side

[Options]
# Allow to send packets to the GDelivery server, 1 - yes, 0 - no
# This permission affects the function of sending messages in the chat, and send items by mail
AllowDeliveryPackets=1
# Allow to send packets to the GameDB server, 1 - yes, 0 - no
# This permission affects the function of information and characters, and everything connected with them
AllowGameDBPackets=1
# Allow adding GM the rights to account, 1 - yes, 0 - no
AllowAddGm=1
# Allow the removal the GM rights from account, 1 - yes, 0 - no
AllowRemoveGm=1
# Allow cleaning logs from the client side 1 - yes, 0 - No
AllowClearLogs=1
# Allow the issuance of Gold on the account, 1 - yes, 0 - no
AllowAddGold=1
# Allow stopping PWAdmin server, 1 - yes, 0 - no
AllowStopPWAdmin=1
# Allow execution of shell commands, 1 - yes, 0 - no
# This permission affects the function of the start / stop instances / processes, cache cleaning
AllowShellCommand=1
# Allow change the account password, 1 - yes, 0 - no
AllowChangePassword=1
# Allow change the data of account, 1 - yes, 0 - no
AllowChangeAcc=1
# Allow chat reading, 1 - yes, 0 - no
AllowReadChat=1
# Allow reading of data from the log world2.formatlog (bargaining, mail, auction), 1 - yes, 0 - no
AllowReadFormatLog=1
# Allow reading data from the world2.log (PK, actions, debug), 1 - yes, 0 - no
AllowReadWorld2Log=1
# Allow octet generator via gs, 1 - yes, 0 - no
AllowItemGenerator=1
# Enter gold values for delivery in silver, not in gold, 1 - yes, 0 - no
GoldAsSilver=0
# The server is a test, 1 - yes, 0 - no (if you enable this option cleaned pause when you stop the server, and does not stop glink when you restart instances)
TestServer=1
# Disabling MySQL queries (actual for servers where MySQL is not installed or is not required), 1 - yes, 0 - no
disable_mysql=0
# Modified AuthD, it can be purchased separately for <70 versions of the server to activate the function associated with the IP last logged on account
# After modification AuthD, IP last login to your account will be recorded in the table MySql

[AuthMod]
# Activate mod. This option will not work on the server versions 70+, 1 - yes, 0 - no
auth_mod=0
# Table name
auth_mod_table=users
# Field name with account ID
auth_mod_userid=ID
# Field name with last login IP
auth_mod_ip=loginip
#
#

